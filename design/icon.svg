<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ultimate Download Manager, "Cascade": three chevrons falling and brightening — many
       connections pulling one file. White on a dark tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1e23"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#bg)"/>
  <rect x="50" y="50" width="924" height="924" rx="214" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="4"/>
  <g fill="none" stroke="#ffffff" stroke-width="96" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 230 L512 400 L724 230" stroke-opacity=".3"/>
    <path d="M300 410 L512 580 L724 410" stroke-opacity=".62"/>
    <path d="M300 590 L512 760 L724 590"/>
  </g>
</svg>
