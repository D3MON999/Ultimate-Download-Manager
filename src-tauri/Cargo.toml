[package]
name = "udm"
description = "Ultimate Download Manager: an all-in-one downloader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
#.
name = "udm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
reqwest.workspace = true
futures.workspace = true
axum.workspace = true
base64.workspace = true
hex.workspace = true
aes = "0.9"
tokio-util.workspace = true
dirs.workspace = true
chrono.workspace = true
udm-engine.workspace = true
udm-ipc.workspace = true
udm-tools.workspace = true
udm-torrent.workspace = true
udm-extract.workspace = true
udm-debrid.workspace = true
udm-remote.workspace = true
# Only its rolling log for now (<data>/logs/udm.log); the crash monitor is not wired in yet.
udm-crash.workspace = true
udm-geo.workspace = true
tracing.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
trash = "5"
arboard = { version = "3", default-features = false }
percent-encoding.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
